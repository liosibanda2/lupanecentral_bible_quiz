        button:hover { background: #3742fa; }

   .correct { background: #2ecc71!important; color: white; }
   .wrong { background: #e74c3c!important; color: white; }
   .hidden { display: none!important; }
   .btn-secondary { background: #7f8c8d; }
   .btn-secondary:hover { background: #636e72; }
   .result-item { background: #f0f0f0; padding: 10px; margin: 5px 0; border-radius: 8px; font-size: 14px; }
   .category-tag { display: inline-block; padding: 3px 8px; border-radius: 12px; font-size: 12px; color: white; margin-left: 8px; font-weight: bold; }
   .adventurer { background: #3498db; }
   .pathfinder { background: #2ecc71; }
   .ambassador { background: #e67e22; }
   .senioryouth { background: #9b59b6; }
   .test { background: #7f8c8d; }
   .participant-welcome { text-align: center; font-style: italic; color: #34495e; font-weight: bold; margin-bottom: 15px; }
   .filter-buttons { display: flex; gap: 8px; margin-bottom: 15px; flex-wrap: wrap; }
   .filter-buttons button { flex: 1; padding: 8px; font-size: 14px; min-width: 90px; }
   .filter-active { outline: 2px solid #2c3e50; }
        label { font-size: 14px; color: #34495e; font-weight: bold; margin-top: 10px; display: block; }

</head>

        <button onclick="login()">Log In</button>
        <button class="btn-secondary" onclick="viewresults()">View Saved Results</button>

    <div class="card hidden" id="quiz-screen">

        <div id="progress" style="text-align: right; color: #7f8c8d; font-size: 14px;"></div>
        <p id="question-text" style="font-size: 18px; font-weight: bold; margin: 20px 0;"></p>
        <div id="options-container"></div>
    </div>

    <div class="card hidden" id="results-screen">

        <div class="filter-buttons">

        let currentName = "";
        let currentUser = "";
        let currentBook = "ezekiel";
        let currentCategory = "test";
        let currentQuestions = [];
        let currentQuestionIndex = 0;
        let score = 0;
        let canAnswer = true;

        function showScreen(screenId) {
            document.getElementById('login-screen').classList.add('hidden');
            document.getElementById('quiz-screen').classList.add('hidden');
            document.getElementById('results-screen').classList.add('hidden');
            document.getElementById(screenId).classList.remove('hidden');
        }

        function login() {
            const nameInput = document.getElementById('username').value.trim();
            const codeInput = document.getElementById('usercode').value.trim().toLowerCase();
            const bookInput = document.getElementById('bookSelect').value;

            if (!nameInput ||!codeInput) {
                alert("Please enter both your Full Name and User-Code.");
                return;
            }

            currentName = nameInput;
            currentUser = codeInput;
            currentBook = bookInput;

            if (codeInput.startsWith("adv")) currentCategory = "adv";
            else if (codeInput.startsWith("path")) currentCategory = "path";
            else if (codeInput.startsWith("amb")) currentCategory = "amb";
            else if (codeInput.startsWith("young")) currentCategory = "young";
            else currentCategory = "test";

            currentQuestions = questionSets[currentBook].questions;
            currentQuestionIndex = 0;
            score = 0;

            showScreen('quiz-screen');
            loadQuestion();
        }

        function loadQuestion() {
            canAnswer = true;
            document.getElementById('welcome-message').innerText =
                `Participant: ${currentName} | Book: ${questionSets[currentBook].name}`;

            const qData = currentQuestions[currentQuestionIndex];
            document.getElementById('quiz-title').innerHTML =
                `Category: <span class="category-tag ${currentCategory}">${currentCategory.toUpperCase()}</span>`;
            document.getElementById('progress').innerText =
                `Question ${currentQuestionIndex + 1}/${currentQuestions.length}`;
            document.getElementById('question-text').innerText = qData.q;

            const container = document.getElementById('options-container');
            container.innerHTML = "";

            qData.o.forEach((option, index) => {
                const div = document.createElement('div');
                div.className = "option";
                div.onclick = () => selectOption(div, index);
                div.innerText = option;
                container.appendChild(div);
            });
        }

        function selectOption(element, index) {
            if (!canAnswer) return;
            canAnswer = false;

            const qData = currentQuestions[currentQuestionIndex];
            const options = document.getElementById('options-container').children;

            if (index === qData.a) {
                element.classList.add('correct');
                score++;
            } else {
                element.classList.add('wrong');
                options[qData.a].classList.add('correct');
            }

            setTimeout(nextQuestion, 1500);
        }

        function nextQuestion() {
            currentQuestionIndex++;
            if (currentQuestionIndex < currentQuestions.length) {
                loadQuestion();
            } else {
                saveResult();
                alert(`Quiz complete, ${currentName}!\nBook: ${questionSets[currentBook].name}\nScore: ${score}/${currentQuestions.length}`);
                viewresults();
            }
        }

        function saveResult() {
            let results = JSON.parse(localStorage.getItem('quiz_results')) || [];

            let categoryName = "Test";
            if (currentCategory === "adv") categoryName = "Adventurer";
            if (currentCategory === "path") categoryName = "Pathfinder";
            if (currentCategory === "amb") categoryName = "Ambassador";
            if (currentCategory === "young") categoryName = "Senior Youth";

            results.push({
                name: currentName,
                user: currentUser,
                book: currentBook,
                category: categoryName,
                score: `${score}/${currentQuestions.length}`,
                date: new Date().toLocaleDateString()
            });
            localStorage.setItem('quiz_results', JSON.stringify(results));
        }

        function viewresults() {
            showScreen('results-screen');
            filterResults('ALL');
        }

        function filterResults(cat) {
            let results = JSON.parse(localStorage.getItem('quiz_results')) || [];
            const listDiv = document.getElementById("results-list");
            listDiv.innerHTML = "";

            document.querySelectorAll('.filter-buttons button').forEach(btn => {
                btn.classList.remove('filter-active');
            });
            document.getElementById('btn-' + cat).classList.add('filter-active');

            if (cat!== 'ALL') {
                results = results.filter(r => r.category === cat);
            }

            if (results.length === 0) {
                listDiv.innerHTML = "<p style='text-align:center; color:#7f8c8d;'>No results yet for this level.</p>";
            } else {
                results.reverse().forEach(r => {
                    let tagClass = r.category.toLowerCase().replace(" ", "");
                    let bookName = questionSets[r.book]?.name || r.book || "Unknown";

                    listDiv.innerHTML += `
                        <div class="result-item">
                            <strong>${r.name}</strong> <small>(${r.user.toUpperCase()})</small>
                            <span class="category-tag ${tagClass}">${r.category}</span>
                            <br>Book: ${bookName} | Score: <strong>${r.score}</strong> on ${r.date}
                        </div>`;
                });
            }
        }

        // Service Worker Registration - MUST be inside same script tag
        if ('serviceWorker' in navigator) {
          window.addEventListener('load', () => {
            navigator.serviceWorker.register('./sw.js')
             .then(reg => {
                console.log('Service Worker registered');
                if(reg.active) {
                  setTimeout(() => alert('App ready for offline use. Load once, then works without internet'), 2000);
                }
              })
             .catch(err => console.log('SW registration failed: ', err));
          });
        }
</script>
